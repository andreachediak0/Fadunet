name: Crear APK FaduNet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: android-actions/setup-android@v4
      - name: Instalar Android SDK
        run: sdkmanager "platforms;android-25" "build-tools;25.0.3"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Compilar
        run: |
          unzip FaduNet-AndroidStudio-2.3.3-v1.0.zip
          chmod +x FaduNet/gradlew
          cd FaduNet
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FaduNet-APK
          path: FaduNet/app/build/outputs/apk/debug/app-debug.apk
