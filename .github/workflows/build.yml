name: Crear APK FaduNet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Instalar Android SDK
        run: sdkmanager "platforms;android-30" "build-tools;30.0.3"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Descargar Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-6.7.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Preparar proyecto
        run: unzip -o FaduNet-cloud-v1.1.zip

      - name: Compilar APK
        run: |
          cd FaduNet
          /tmp/gradle-6.7.1/bin/gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FaduNet-APK
          path: FaduNet/app/build/outputs/apk/debug/app-debug.apk
