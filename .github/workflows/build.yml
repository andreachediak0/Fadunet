name: Crear APK FaduNet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Preparar Java 17 para el SDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Instalar Android SDK
        run: sdkmanager "platforms;android-25" "build-tools;25.0.3"

      - name: Preparar Java 8 para compilar FaduNet
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
      - name: Descargar Gradle 3.3
        run: |
          curl -L https://services.gradle.org/distributions/gradle-3.3-all.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Compilar
        run: |
          unzip -o FaduNet-AndroidStudio-2.3.3-v1.0.zip
          cd FaduNet
          /tmp/gradle-3.3/bin/gradle --no-daemon assembleDebug

      
          name: FaduNet-APK
          path: FaduNet/app/build/outputs/apk/debug/app-debug.apk
